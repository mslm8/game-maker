<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="استودیو ساخت پروژه با رابط فارسی">
<title>استودیو ساخت پروژه</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">✦</span><div><b>استودیو ساز</b><small>ساخت و مدیریت پروژه</small></div></div>
  <div class="actions"><button id="theme">☾</button><button id="newTop" class="primary">＋ پروژه جدید</button></div>
</header>
<div class="layout">
  <aside>
    <button class="nav active" data-view="home">⌂ داشبورد</button>
    <button class="nav" data-view="projects">▣ پروژه‌ها</button>
    <button class="nav" data-view="settings">⚙ تنظیمات</button>
    <div class="side-note"><b>شروع سریع</b><p>یک پروژه بساز و از همین‌جا مدیریت کن.</p><button id="newSide" class="primary full">ساخت پروژه</button></div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal hidden">
 <div class="dialog">
  <button id="close" class="close">×</button>
  <h2>پروژه جدید</h2><p>نام پروژه را وارد کن.</p>
  <input id="projectName" placeholder="مثلاً بازی من">
  <button id="create" class="primary full">ساخت پروژه</button>
 </div>
</div>
<script src="app.js"></script>
</body>
</html>
